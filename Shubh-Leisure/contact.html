<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — Shubh Leisure</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<style>
  :root {
    --navy:#0d2233;
    --deep:#11202b;
    --beige:#f5efe6;
    --gold:#d9c79a;
    --muted:#6f7a85;
  }
  * { box-sizing: border-box; }
  body {
    margin:0;
    font-family:Inter, Arial;
    background: linear-gradient(180deg, var(--beige), #faf7f3);
    color:var(--deep);
  }

  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-image: url('https://blog.venuelook.com/wp-content/uploads/2023/07/South-Indian-Wedding-D%C3%A9cor-e1689408167894.jpeg');
    background-size: cover;
    background-position: center;
    filter: blur(7px) brightness(.82);
    transform: scale(1.03);
  }
  .backdrop::after {
    content:"";
    position:absolute;
    inset:0;
    background:rgba(255,255,255,0.36);
  }

  .page {
    position:relative;
    z-index:10;
    max-width:900px;
    margin:120px auto;
    padding:24px;
  }

  header {
    position:fixed;
    top:18px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:30;
    padding:10px 18px;
    border-radius:12px;
    background:rgba(255,255,255,0.78);
    backdrop-filter:blur(6px);
    box-shadow:0 10px 30px rgba(10,16,24,0.08);
    border:1px solid rgba(255,255,255,0.6);
  }
  .brand { font-family:'Playfair Display'; font-weight:700; color:var(--navy) }
  nav a { margin-left:14px; text-decoration:none; color:var(--deep); font-weight:600 }
  nav a:hover { color:var(--navy) }

  .title {
    font-family:'Playfair Display';
    font-size:44px;
    text-align:center;
    color:#0b1a28;
    margin-bottom:8px;
  }
  .divider {
    width:72px;
    height:3px;
    background:var(--gold);
    border-radius:10px;
    margin:0 auto 28px;
  }

  .card {
    background:rgba(255,255,255,0.78);
    backdrop-filter:blur(10px);
    padding:28px;
    border-radius:16px;
    border:1px solid rgba(255,255,255,0.6);
    box-shadow:0 18px 40px rgba(0,0,0,0.12);
  }

  .section-title {
    font-family:'Playfair Display';
    font-size:22px;
    color:var(--navy);
    margin-bottom:10px;
  }

  .contact-list {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
  }
  .contact-item {
    background:rgba(255,255,255,0.9);
    padding:14px;
    border-radius:12px;
    border:1px solid rgba(0,0,0,0.04);
    box-shadow:0 8px 20px rgba(0,0,0,0.06);
  }
  .contact-item h4 {
    margin:0 0 6px 0;
    font-family:'Playfair Display';
  }
  .contact-item p { margin:0; color:var(--muted); font-size:15px }

  .map {
    margin-top:18px;
    border-radius:10px;
    overflow:hidden;
    border:1px solid rgba(0,0,0,0.04);
  }

  .address-text {
    margin-top:10px;
    color:var(--deep);
    font-size:15px;
    font-weight:600;
  }

  .copyright {
    margin-top:26px;
    text-align:center;
    font-size:14px;
    color:var(--muted);
  }

  @media (max-width:820px){
    .contact-list { grid-template-columns:1fr; }
    .title { font-size:36px }
  }
</style>
</head>
<body>

<div class="backdrop"></div>

<header>
  <div class="brand">Shubh Leisure</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="packages.html">Packages</a>
    <a href="about.html">About</a>
  </nav>
</header>

<main class="page">
  <h1 class="title">Contact</h1>
  <div class="divider"></div>

  <section class="card">

    <h2 class="section-title">Get in touch</h2>

    <div class="contact-list">

      <div class="contact-item">
        <h4>Email</h4>
        <p>contact@shubhleisure.com</p>
      </div>

      <div class="contact-item">
        <h4>Phone</h4>
        <p>87654 34567 / 75432 46953</p>
      </div>

      <div class="contact-item">
        <h4>Instagram</h4>
        <p>@shubhLeisure</p>
      </div>

      <div class="contact-item">
        <h4>Facebook</h4>
        <p>Shubh Leisure</p>
      </div>

    </div>

    <!-- UPDATED MAP + ADDRESS -->
    <div class="map">
      <iframe
        title="map"
        src="https://maps.google.com/maps?q=12.976740,%2077.644041&t=&z=16&ie=UTF8&iwloc=&output=embed"
        style="width:100%; height:220px; border:0;">
      </iframe>
    </div>

    <div class="address-text">
      (#81, 2nd Cross, 2nd Main, Indiranagar, Bangalore - 38)
    </div>

    <div class="copyright">
      © 2022 Shubh Leisure — All rights reserved
    </div>

  </section>
</main>

</body>
</html>
