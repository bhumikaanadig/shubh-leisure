<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment — Shubh Leisure</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>

<style>
  :root{ --navy:#0d2233; --deep:#11202b; --beige:#f5efe6; --gold:#d9c79a; --muted:#6f7a85 }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Inter, Arial;
    background:linear-gradient(180deg,var(--beige), #faf7f3);
    color:var(--deep);
  }

  .backdrop{
    position:fixed; inset:0; z-index:0;
    background-image:url('https://blog.venuelook.com/wp-content/uploads/2023/07/South-Indian-Wedding-D%C3%A9cor-e1689408167894.jpeg');
    background-size:cover; background-position:center;
    filter:blur(7px) brightness(.82);
    transform:scale(1.03);
  }
  .backdrop::after{
    content:""; position:absolute; inset:0;
    background:rgba(255,255,255,0.36);
  }

  .page{
    position:relative;
    z-index:10;
    max-width:520px;
    margin:140px auto;
    padding:24px;
  }

  .card{
    background:rgba(255,255,255,0.9);
    padding:28px;
    border-radius:14px;
    box-shadow:0 18px 40px rgba(0,0,0,0.12);
    border:1px solid rgba(0,0,0,0.04);
    text-align:center;
  }

  h1{
    font-family:'Playfair Display';
    margin:0 0 6px 0;
  }

  .divider{
    width:70px;
    height:3px;
    background:var(--gold);
    margin:10px auto 20px;
    border-radius:6px;
  }

  .summary{
    font-size:15px;
    color:var(--muted);
    margin-bottom:18px;
  }

  .amount{
    font-size:32px;
    font-weight:700;
    color:var(--navy);
    margin:10px 0 18px;
  }

  .btn{
    padding:14px 20px;
    width:100%;
    border-radius:12px;
    background:linear-gradient(90deg,var(--navy),#16324a);
    color:#fff;
    border:none;
    font-weight:700;
    cursor:pointer;
    font-size:16px;
  }

  .note{
    margin-top:14px;
    font-size:13px;
    color:var(--muted);
  }
</style>
</head>

<body>

<div class="backdrop" aria-hidden="true"></div>

<main class="page">
  <div class="card">
    <h1>Payment</h1>
    <div class="divider"></div>

    <div class="summary" id="summary"></div>

    <div class="amount">₹ 5,000</div>
    <div style="font-size:14px; color:var(--muted); margin-bottom:18px;">
    A small fee to confirm and block your event slot.
    </div>


    <button class="btn" onclick="pay()">Pay Securely</button>
  </div>
</main>

<script>
const booking = JSON.parse(localStorage.getItem('currentBooking'));


document.getElementById('summary').innerText =
  booking
    ? `Event: ${booking.type} • Date: ${booking.date}`
    : 'Booking details unavailable';

function pay(){
  alert("Payment successful!! 🎉\nThank you for choosing us\nShubh Leisure team will contact you soon ;).");
  localStorage.removeItem('shubh_booking_current');
  window.location.href = "index.html";
}
</script>

</body>
</html>
